name: victordg-portfolio

services:
  portfolio:
    image: nginx:1.27-alpine
    container_name: victordg-portfolio
    restart: unless-stopped
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./portifolio.html:/usr/share/nginx/html/portifolio.html:ro
      - ./cv.html:/usr/share/nginx/html/cv.html:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./robots.txt:/usr/share/nginx/html/robots.txt:ro
      - ./sitemap.xml:/usr/share/nginx/html/sitemap.xml:ro
      - ./llms.txt:/usr/share/nginx/html/llms.txt:ro
    networks:
      - vps-proxy

networks:
  vps-proxy:
    external: true
