<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="t d">
<title id="t">Invariant Security architecture</title>
<desc id="d">Browser to Cloudflare to nginx. nginx serves the React SPA on / and proxies /api to the FastAPI control plane, the only service with a database. The API calls assessment, discovery and ingestion with one token per service. Assessment reaches hosts over SSH; discovery probes them over TCP and TLS; ingestion turns CIS Benchmark PDFs into controls on admin request. The on-prem appliance ships the same services; licensing sync is in progress. Delivery: PR, CI, image on GHCR, digest PR, apply.</desc>
