<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
<title id="t">Invariant Security architecture</title>
<desc id="d">React frontend calls the FastAPI control plane over HTTPS. The API alone talks to PostgreSQL and calls the assessment, ingestion and discovery services over internal HTTP with one token per service. Assessment reaches targets over SSH or docker exec. On-prem appliances sync signed licenses with the licensing service.</desc>
<rect width="900" height="520" fill="#f5f2ea"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6f7066"/></marker></defs>
<g fill="none" stroke="#6f7066" stroke-width="1.2" marker-end="url(#a)">
<path d="M235 88 H365"/><path d="M560 88 H690"/>
<path d="M460 126 V200 H160 V254"/><path d="M460 200 V254"/><path d="M460 200 H760 V254"/>
<path d="M160 330 V420"/><path d="M560 458 H655"/>
</g>
