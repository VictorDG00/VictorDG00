<text x="880" y="372" fill="#5c5d55" font-family="&quot;SFMono-Regular&quot;,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="11" text-anchor="end" letter-spacing="1.5">SAAS ↑   ON-PREM ↓</text>
<g><rect x="40" y="50" width="195" height="76" fill="#f5f2ea" stroke="#a8a593"/><text x="137.5" y="82" fill="#1d1e1b" font-family="&quot;Segoe UI&quot;,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle">React</text><text x="137.5" y="105" fill="#5c5d55" font-family="&quot;SFMono-Regular&quot;,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="12" text-anchor="middle">frontend · SPA</text></g><g><rect x="365" y="50" width="195" height="76" fill="#f5f2ea" stroke="#8a6a2e"/><text x="462.5" y="82" fill="#1d1e1b" font-family="&quot;Segoe UI&quot;,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle">Invariant API</text><text x="462.5" y="105" fill="#5c5d55" font-family="&quot;SFMono-Regular&quot;,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="12" text-anchor="middle">FastAPI · control plane</text></g><g><rect x="690" y="50" width="180" height="76" fill="#f5f2ea" stroke="#a8a593"/><text x="780.0" y="82" fill="#1d1e1b" font-family="&quot;Segoe UI&quot;,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle">PostgreSQL</text><text x="780.0" y="105" fill="#5c5d55" font-family="&quot;SFMono-Regular&quot;,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="12" text-anchor="middle">owned by the API</text></g>
